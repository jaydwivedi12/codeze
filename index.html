<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codeze Technologies</title>

  <!-- Redirect all routes to home -->
  <script>
    if (
      window.location.pathname !== "/" &&
      window.location.pathname !== "/index.html"
    ) {
      window.location.replace("/");
    }
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b1120;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 20px;
      max-width: 700px;
    }

    .logo {
      font-size: 4rem;
      font-weight: bold;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 15px;
    }

    p {
      color: #cbd5e1;
      font-size: 1.1rem;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      transition: 0.3s ease;
      font-weight: bold;
    }

    .btn:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }

    .contact {
      margin-top: 40px;
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .contact a {
      color: #60a5fa;
      text-decoration: none;
    }

    .bg {
      position: absolute;
      width: 500px;
      height: 500px;
      background: rgba(37, 99, 235, 0.15);
      border-radius: 50%;
      filter: blur(100px);
      z-index: -1;
    }

    .bg1 {
      top: -100px;
      left: -100px;
    }

    .bg2 {
      bottom: -100px;
      right: -100px;
    }

    @media (max-width: 768px) {
      .logo {
        font-size: 3rem;
      }

      h1 {
        font-size: 2rem;
      }

      p {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>

  <div class="bg bg1"></div>
  <div class="bg bg2"></div>

  <div class="container">
    <div class="logo">Codeze Technologies</div>

    <h1>Building Modern Digital Products</h1>

    <p>
      Codeze Technologies creates scalable software solutions,
      AI-powered platforms, automation systems, and modern web applications
      for startups, creators, and businesses.
    </p>

    <a href="mailto:contact@codeze.in" class="btn">
      Contact Us
    </a>

    <div class="contact">
      contact@codeze.in
    </div>
  </div>

</body>
</html>
